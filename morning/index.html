/* Layout: a dawn band for the headline, then white sheets on a cool lilac ground. Indigo = college, sunrise orange = Feena, rose = meetings and due, teal = reading. */
:root{
  --paper:#F1F1F9; --sheet:#FFFFFF; --ink:#17153A; --ink-2:#55536E; --ink-3:#8F8DA6;
  --rule:#E4E3F0; --grid:rgba(23,21,58,.035);
  --cobalt:#4F46E5; --cobalt-wash:#ECEBFE;
  --due:#E11D48; --due-wash:#FFE4EA; --soon:#EA580C; --soon-wash:#FFEDD8; --ok:#16A34A;
  --teal:#0D9488; --teal-wash:#D5F7F1;
  --dawn-1:#1E1B4B; --dawn-2:#6D28D9; --dawn-3:#F97316; --dawn-sun:#FDBA74; --on-dawn:#FFFFFF;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E0D1C; --sheet:#17162B; --ink:#ECEBFA; --ink-2:#B3B1CC; --ink-3:#77758F;
  --rule:#2A2844; --grid:rgba(236,235,250,.03);
  --cobalt:#A5A0FF; --cobalt-wash:#272463;
  --due:#FB7185; --due-wash:#3D1626; --soon:#FB923C; --soon-wash:#3B2414; --ok:#4ADE80;
  --teal:#2DD4BF; --teal-wash:#0F3330;
  --dawn-1:#120F33; --dawn-2:#4C1D95; --dawn-3:#C2410C; --dawn-sun:#FB923C; --on-dawn:#FFF7ED; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E0D1C; --sheet:#17162B; --ink:#ECEBFA; --ink-2:#B3B1CC; --ink-3:#77758F;
  --rule:#2A2844; --grid:rgba(236,235,250,.03);
  --cobalt:#A5A0FF; --cobalt-wash:#272463;
  --due:#FB7185; --due-wash:#3D1626; --soon:#FB923C; --soon-wash:#3B2414; --ok:#4ADE80;
  --teal:#2DD4BF; --teal-wash:#0F3330;
  --dawn-1:#120F33; --dawn-2:#4C1D95; --dawn-3:#C2410C; --dawn-sun:#FB923C; --on-dawn:#FFF7ED; color-scheme:dark}

body{background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
.wrap{max-width:780px;margin:0 auto;padding-block:40px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
a{color:inherit;text-decoration-color:var(--ink-3);text-underline-offset:3px}
a:hover{text-decoration-color:var(--cobalt)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;border-radius:3px}

header{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:30px 28px 34px;border-radius:6px;color:var(--on-dawn);
  background:radial-gradient(circle at 88% 118%, var(--dawn-sun) 0 14%, transparent 15%), radial-gradient(ellipse at 85% 110%, rgba(253,186,116,.55), transparent 55%), linear-gradient(160deg,var(--dawn-1) 0%,var(--dawn-2) 55%,var(--dawn-3) 100%)}
header .mono{color:var(--on-dawn);opacity:.75}
header .sub{color:var(--on-dawn);opacity:.88}
@media (max-width:560px){header{padding:22px 18px 26px}}
.stamp{display:flex;flex-wrap:wrap;gap:6px 16px}
h1{font:700 clamp(30px,6vw,46px)/1.08 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--ink-2);margin:0;max-width:60ch}

.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sheet h2{font:600 13px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;margin:0;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.sheet h2 span{color:var(--ink-3);font-weight:400}

/* cloud */
.cloud{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 12px;padding:10px 0 4px}
.chip{font-family:var(--f-display);font-weight:500;line-height:1.1;border:0;cursor:pointer;border-radius:999px;padding:.38em .8em;background:var(--paper);color:var(--ink);transition:transform .15s, opacity .2s}
.chip:hover{transform:translateY(-1px)}
.chip.w1{font-size:14px}.chip.w2{font-size:18px}.chip.w3{font-size:24px;font-weight:700}
.chip.w3.college{background:var(--cobalt);color:var(--sheet)}.chip.w3.feena{background:var(--soon);color:var(--sheet)}
.chip.college{background:var(--cobalt-wash);color:var(--cobalt)}
.chip.feena{background:var(--soon-wash);color:var(--soon)}
.chip.setup{background:var(--rule);color:var(--ink-2)}
.chip.read{background:var(--teal-wash);color:var(--teal)}
.chip{display:inline-flex;align-items:center;gap:.45em}
.tick{width:.85em;height:.85em;border-radius:50%;border:2px solid currentColor;opacity:.55;flex:none;display:grid;place-items:center;box-sizing:border-box}
.chip.done{opacity:.45;text-decoration:line-through}
.chip.done .tick{opacity:1;background:currentColor}
.chip.done .tick::after{content:"";width:.22em;height:.42em;border:solid var(--sheet);border-width:0 2px 2px 0;transform:translateY(-.05em) rotate(45deg)}
.chip.w3.college .tick::after{border-color:var(--cobalt)}.chip.w3.feena .tick::after{border-color:var(--soon)}
.h-right{display:inline-flex;gap:12px;align-items:baseline}
.edit-btn{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;background:none;border:1px solid var(--rule);color:var(--ink-2);border-radius:3px;padding:5px 8px;cursor:pointer}
.edit-btn[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.cloud.editing .chip{cursor:pointer;outline:1.5px dashed currentColor;outline-offset:2px}
.chip .x{display:none;font:600 .8em/1 var(--f-body);margin-left:.2em;opacity:.7}
.cloud.editing .chip .x{display:inline}
.cloud.editing .chip .tick{display:none}
.chip.mine{font-style:normal}
.addform{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding-top:8px;border-top:1px dashed var(--rule)}
.addform .grow{flex:1 1 220px}
.addform select{font:400 14px/1.3 var(--f-body);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:8px 10px}
.addform .btn{grid-column:auto;padding:10px 16px}
.track{height:4px;border-radius:2px;background:var(--rule);overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--cobalt),var(--soon));transition:width .3s}
.hint{margin:0;text-align:center;font-size:12px;color:var(--ink-3)}
/* meetings */
.mform{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr;gap:10px;align-items:end}
.mform .wide{grid-column:span 2}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f span{font:500 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.f input{font:400 14px/1.3 var(--f-body);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:8px 10px;min-width:0;width:100%;box-sizing:border-box}
.btn{grid-column:span 1;font:600 14px/1 var(--f-body);background:var(--cobalt);color:var(--sheet);border:0;border-radius:4px;padding:11px 14px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.msg{margin:0;font-size:13px;color:var(--ink-2);min-height:1em}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mlist li{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:baseline;padding:9px 0;border-top:1px solid var(--rule)}
.mlist .tm{font:500 12px/1.35 var(--f-mono);text-transform:uppercase;font-variant-numeric:tabular-nums}
.mlist .nm{min-width:0}.mlist .nm small{display:block;color:var(--ink-2);font-size:13px}
.mlist button{font:400 12px/1 var(--f-mono);background:none;border:0;color:var(--ink-3);cursor:pointer;padding:4px}
.mlist button:hover{color:var(--due)}
.k.Meeting{background:var(--due-wash);color:var(--due)}
.week .b.Meeting{background:var(--due-wash);color:var(--due)}
@media (max-width:560px){.mform{grid-template-columns:1fr 1fr}.mform .wide,.btn{grid-column:1/-1}.mlist li{grid-template-columns:1fr auto}.mlist .tm{grid-column:1/-1}}

/* plan */
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan li{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--rule)}
.plan li:first-child{border-top:0;padding-top:2px}
.plan input{appearance:none;width:20px;height:20px;border:1.5px solid var(--ink-3);border-radius:4px;margin:2px 0 0;cursor:pointer;display:grid;place-items:center;background:transparent}
.plan input:checked{background:var(--cobalt);border-color:var(--cobalt)}
.plan input:checked::after{content:"";width:5px;height:10px;border:solid var(--sheet);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.plan .t{font-weight:600}
.plan .d{color:var(--ink-2);font-size:14px}
.plan li.done .t{text-decoration:line-through;color:var(--ink-3)}
.tag{font:500 11px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:4px 6px;border-radius:3px;margin-left:8px;vertical-align:2px;white-space:nowrap}
.tag.college{background:var(--cobalt-wash);color:var(--cobalt)}
.tag.feena{background:var(--soon-wash);color:var(--soon)}
.tag.setup{background:var(--rule);color:var(--ink-2)}

/* classes */
.cls{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.cls li{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:baseline;padding:9px 0;border-top:1px solid var(--rule)}
.cls li:first-child{border-top:0}
.cls .tm{font:500 13px/1.3 var(--f-mono);font-variant-numeric:tabular-nums}
.cls .nm{min-width:0}
.cls .nm small{display:block;color:var(--ink-2);font-size:13px}
.cls .rm{font:400 12px/1.3 var(--f-mono);color:var(--ink-3);white-space:nowrap}
.cls li.past{opacity:.5}
.cls li.maybe .nm::after{content:" · your group?";color:var(--soon);font-size:12px}
.k{font:500 10.5px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;margin-right:6px;padding:3px 5px;border-radius:3px;vertical-align:1px}
.k.Lecture{background:var(--rule);color:var(--ink-2)}
.k.Tutorial{background:var(--cobalt-wash);color:var(--cobalt)}
.k.Lab{background:var(--soon-wash);color:var(--soon)}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding-top:6px;border-top:1px dashed var(--rule)}
.week .col{display:flex;flex-direction:column;gap:3px;min-width:0}
.week .dn{font:500 11px/1.6 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.week .col.on .dn{color:var(--cobalt)}
.week .b{font:400 11px/1.25 var(--f-mono);padding:4px 5px;border-radius:3px;background:var(--paper);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.week .b.Tutorial{background:var(--cobalt-wash)}.week .b.Lab{background:var(--soon-wash)}
.none{color:var(--ink-2);font-size:14px;margin:0}

/* essay */
.essay .et{font:700 clamp(22px,4vw,28px)/1.15 var(--f-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.essay .et a{text-decoration-thickness:2px;text-decoration-color:var(--teal)}
.essay{border-top:3px solid var(--teal)}
.essay .em{font:400 12px/1.4 var(--f-mono);color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.essay .ew{color:var(--ink-2);margin:0;max-width:62ch}

/* deadlines */
.dl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.dl li{display:grid;grid-template-columns:22px 92px 1fr;gap:14px;align-items:baseline;padding:10px 12px;border-radius:3px;border-left:3px solid var(--rule);background:var(--paper)}
.dl li.today{border-left-color:var(--due);background:var(--due-wash)}
.dl li.soon{border-left-color:var(--soon);background:var(--soon-wash)}
.dl .when{font:500 12px/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.dl .what{min-width:0}
.dl .what small{display:block;color:var(--ink-2);font-size:13px}
.dtick{appearance:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--ink-3);background:transparent;cursor:pointer;padding:0;align-self:center;display:grid;place-items:center}
.dl li.today .dtick{border-color:var(--due)}.dl li.soon .dtick{border-color:var(--soon)}
.dl li.done{opacity:.5;border-left-color:var(--ok);background:var(--paper)}
.dl li.done .what{text-decoration:line-through}
.dl li.done .dtick{background:var(--ok);border-color:var(--ok)}
.dl li.done .dtick::after{content:"";width:5px;height:9px;border:solid var(--sheet);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.empty{border:1px dashed var(--ink-3);border-radius:3px;padding:14px 16px;color:var(--ink-2);font-size:14px;display:flex;flex-direction:column;gap:8px}
.empty b{color:var(--ink)}
.empty ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* news */
.news{list-style:none;margin:0;padding:0;counter-reset:n;display:flex;flex-direction:column}
.news li{counter-increment:n;display:grid;grid-template-columns:36px 1fr;gap:10px;padding:14px 0;border-top:1px solid var(--rule)}
.news li:first-child{border-top:0;padding-top:2px}
.news li::before{content:counter(n);font:700 24px/1 var(--f-display);color:var(--soon);font-variant-numeric:tabular-nums}
.news .h{font-weight:600;line-height:1.35}
.news .s{color:var(--ink-2);font-size:14px;margin-top:3px}
.news .why{font:400 12px/1.4 var(--f-mono);color:var(--ink-3);margin-top:6px}

.radar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.radar div{background:var(--paper);border-radius:3px;padding:12px 14px;font-size:14px;color:var(--ink-2);min-width:0}
.radar b{color:var(--ink);display:block;margin-bottom:2px}

footer{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-3)}
footer a{color:var(--ink-3)}

@media (max-width:560px){
  .sheet{padding:18px 16px}
  .dl li{grid-template-columns:22px 1fr;gap:2px 12px}.dl .when{grid-column:2}.dl .what{grid-column:2}.dl .dtick{grid-row:1/3}
}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:rise .35s ease-out both}
  .sheet:nth-of-type(2){animation-delay:.05s}.sheet:nth-of-type(3){animation-delay:.1s}.sheet:nth-of-type(4){animation-delay:.15s}
  @keyframes rise{from{transform:translateY(6px)}to{transform:none}}
}
</style>

<div class="wrap">
  <header>
    <div class="stamp mono"><span id="stamp-date"></span><span>Dublin</span><span id="stamp-count"></span></div>
    <h1 id="headline"></h1>
    <p class="sub" id="sub"></p>
  </header>

  <section class="sheet" aria-labelledby="h-cloud">
    <h2 id="h-cloud">On your plate <span class="h-right"><span id="cloud-progress"></span><button type="button" class="edit-btn" id="cloud-edit" aria-pressed="false">Edit</button></span></h2>
    <div class="track" aria-hidden="true"><div class="bar" id="cloud-bar"></div></div>
    <div class="cloud" id="cloud"></div>
    <form class="addform" id="addform" hidden autocomplete="off">
      <label class="f grow"><span>Add something</span><input id="add-text" maxlength="60" placeholder="e.g. Revise Snell's law"></label>
      <label class="f"><span>Size</span><select id="add-weight"><option value="1">Small</option><option value="2" selected>Medium</option><option value="3">Big</option></select></label>
      <label class="f"><span>Type</span><select id="add-tag"><option value="college">College</option><option value="feena">Feena</option><option value="read">Reading</option><option value="setup">Other</option></select></label>
      <button type="submit" class="btn">Add</button>
    </form>
    <p class="hint" id="cloud-hint">Bigger means more urgent. Tap a task to check it off; tap again to undo.</p>
  </section>

  <section class="sheet" aria-labelledby="h-classes">
    <h2 id="h-classes">Today <span id="classes-label"></span></h2>
    <div id="classes"></div>
    <div class="week" id="week" aria-label="Week at a glance"></div>
  </section>

  <section class="sheet" aria-labelledby="h-meet">
    <h2 id="h-meet">Meetings <span id="meet-status">Loading</span></h2>
    <form class="mform" id="mform" autocomplete="off">
      <label class="f wide"><span>What</span><input id="m-title" required maxlength="120" placeholder="Call with Dogpatch"></label>
      <label class="f"><span>Date</span><input id="m-date" type="date" required></label>
      <label class="f"><span>Start</span><input id="m-start" type="time" required></label>
      <label class="f wide"><span>Where</span><input id="m-where" maxlength="120" placeholder="Zoom, Dogpatch Labs, Q120"></label>
      <label class="f"><span>End</span><input id="m-end" type="time"></label>
      <button type="submit" class="btn" id="m-add">Add meeting</button>

  <section class="sheet" aria-labelledby="h-due">

  <section class="sheet" aria-labelledby="h-radar" id="radar-sheet">

  <footer id="sources"></footer>

<script>
(function(){
  const D = JSON.parse(document.getElementById('brief-data').textContent);
  const $ = id => document.getElementById(id);
  const el = (tag, props={}, kids=[]) => { const n=document.createElement(tag); Object.assign(n,props); kids.forEach(k=>n.append(k)); return n; };
  const link = (text,url) => url && /^https:\/\//.test(url) ? el('a',{href:url,target:'_blank',rel:'noopener',textContent:text}) : document.createTextNode(text);

  const d = new Date(D.date+'T12:00:00');
  $('stamp-date').textContent = d.toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  $('headline').textContent = D.headline;
  $('sub').textContent = D.sub || '';

  // cloud: what's on your plate.
  // Generated items come from the morning refresh. Tap to check off. In Edit mode, tap an item to
  // cycle its size, × removes it, and the form adds your own. On the Claude page everything is saved
  // to the page's database (own items persist until removed); elsewhere it is saved in this browser.
  const key = 'km-cloud-'+D.date, mineKey = 'km-cloud-mine', ovKey = 'km-cloud-ov-'+D.date;
  const ls = { get(k,f){ try{ return JSON.parse(localStorage.getItem(k)||'null') ?? f; }catch(e){ return f; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
  let done = ls.get(key,{});                 // text -> true
  let ov = ls.get(ovKey,{hidden:[],weights:{}}); // today's edits to generated items
  let own = ls.get(mineKey,[]);             // [{id,text,weight,tag,doneOn}]
  let editing = false, cdb = null, checksDoc = null;
  const gen = D.cloud || [];
  const items = () => {
    const hid = new Set(ov.hidden||[]);
    const g = gen.filter(c=>!hid.has(c.text)).map(c=>Object.assign({},c,{weight:(ov.weights||{})[c.text]||c.weight||1, gen:true}));
    const m = own.filter(x=>!x.doneOn || x.doneOn===D.date).map(x=>Object.assign({},x,{own:true}));
    const out=[], seen=new Set(); g.concat(m).forEach(c=>{ if(!seen.has(c.text)){ seen.add(c.text); out.push(c); } });
    return out;
  };
  const saveChecks = () => {
    ls.set(key,done); ls.set(ovKey,ov);
    if (checksDoc) checksDoc.set({date:D.date, done:Object.keys(done).filter(k=>done[k]), hidden:ov.hidden||[], weights:ov.weights||{}, updatedAt:new Date().toISOString()}).catch(()=>{});
  };
  const saveMine = (item) => {
    ls.set(mineKey,own);
    if (cdb && item) { const {id,...rest}=item; cdb.collection('plate').doc(id).set(rest).catch(()=>{}); }
  };
  const removeMine = (id) => { own = own.filter(x=>x.id!==id); ls.set(mineKey,own); if (cdb) cdb.collection('plate').doc(id).delete().catch(()=>{}); };
  const renderCloud = () => {
    const box = $('cloud'); box.textContent=''; box.classList.toggle('editing',editing);
    const list = items();
    list.forEach(c=>{
      const on = !!done[c.text];
      const b = el('button',{type:'button',className:'chip w'+c.weight+' '+(c.tag||'')+(on?' done':'')+(c.own?' mine':'')},[el('span',{className:'tick','aria-hidden':'true'}), document.createTextNode(c.text)]);
      const x = el('span',{className:'x',textContent:'×'}); x.setAttribute('role','button'); x.setAttribute('aria-label','Remove '+c.text); b.append(x);
      b.setAttribute('aria-pressed',on);
      x.addEventListener('click',ev=>{ ev.stopPropagation();
        if (c.own) removeMine(c.id); else { ov.hidden=(ov.hidden||[]).concat(c.text); }
        delete done[c.text]; saveChecks(); renderCloud(); });
      b.addEventListener('click',()=>{
        if (editing){ const w=c.weight%3+1;
          if (c.own){ const it=own.find(x=>x.id===c.id); it.weight=w; saveMine(it); }
          else { ov.weights=Object.assign({},ov.weights,{[c.text]:w}); saveChecks(); }
          renderCloud(); return; }
        done[c.text]=!done[c.text]; if(!done[c.text]) delete done[c.text];
        if (c.own){ const it=own.find(x=>x.id===c.id); it.doneOn = done[c.text]? D.date : null; saveMine(it); }
        saveChecks(); renderCloud();
      });
      box.append(b);
    });
    const n = list.filter(c=>done[c.text]).length;
    $('cloud-progress').textContent = n+' / '+list.length+' done';
    $('cloud-bar').style.width = (list.length? n/list.length*100 : 0)+'%';
  };
  $('cloud-edit').addEventListener('click',()=>{
    editing=!editing; $('cloud-edit').setAttribute('aria-pressed',editing); $('cloud-edit').textContent = editing?'Done':'Edit';
    $('addform').hidden=!editing;
    $('cloud-hint').textContent = editing ? 'Tap an item to change its size. × removes it. Your own items stay until you remove or finish them.' : 'Bigger means more urgent. Tap a task to check it off; tap again to undo.';
    renderCloud(); if(editing) $('add-text').focus();
  });
  $('addform').addEventListener('submit',ev=>{
    ev.preventDefault();
    const text=$('add-text').value.trim(); if(!text) return;
    if (items().some(c=>c.text===text)) { $('add-text').select(); return; }
    const it={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), text, weight:+$('add-weight').value, tag:$('add-tag').value, createdAt:new Date().toISOString(), doneOn:null};
    own.push(it); saveMine(it); $('add-text').value=''; renderCloud();
  });
  renderCloud();
  (async ()=>{
    const d2 = window.claude && window.claude.use ? await window.claude.use('db') : null;
    if (!d2) return;
    cdb = d2;
    checksDoc = d2.collection('checks').doc(D.date);
    checksDoc.onSnapshot(snap=>{
      const data = snap && snap.data && snap.data(); if (!data) return;
      if (Array.isArray(data.done)){ done={}; data.done.forEach(t=>{done[t]=true;}); }
      ov = {hidden:Array.isArray(data.hidden)?data.hidden:[], weights:data.weights||{}};
      ls.set(key,done); ls.set(ovKey,ov); renderCloud();
    }, ()=>{});
    d2.collection('plate').onSnapshot(snap=>{
      own = snap.docs.map(d=>Object.assign({id:d.id}, d.data()||{})).filter(x=>x.text);
      ls.set(mineKey,own); renderCloud();
    }, ()=>{});
  })();

  // classes
  const TT = D.timetable || [], C = D.config || {};
  const dow = d.getDay(); // 0 Sun..6 Sat
  const inGroup = c => !c.group || (/^Tut group/.test(c.group) ? (!C.tutGroup || c.group.endsWith(' '+C.tutGroup)) : (!C.labGroup || c.group.endsWith(' '+C.labGroup)));
  const known = c => !c.group || (/^Tut/.test(c.group) ? !!C.tutGroup : !!C.labGroup);
  const mine = TT.filter(inGroup);
  const now = new Date(); const sameDay = now.toDateString() === d.toDateString();
  const mins = s => { const [h,m]=s.split(':').map(Number); return h*60+m; };
  const todays = mine.filter(c=>c.day===dow).sort((a,b)=>mins(a.start)-mins(b.start));
  let meetings = [];
  const fmtDate = s => new Date(s+'T12:00:00').toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short'});
  const renderToday = () => {
    const items = todays.map(c=>Object.assign({},c)).concat(meetings.filter(m=>m.date===D.date).map(m=>({start:m.start,end:m.end||m.start,name:m.title,code:'',kind:'Meeting',room:m.where||'',group:''})));
    items.sort((a,b)=>mins(a.start)-mins(b.start));
    const nc = todays.length, nm = items.length-nc;
    $('classes-label').textContent = [nc?nc+' class'+(nc>1?'es':''):'', nm?nm+' meeting'+(nm>1?'s':''):''].filter(Boolean).join(' · ') || 'Physics, year 1';
    const box = $('classes'); box.textContent='';
    if (!items.length){ box.append(el('p',{className:'none',textContent: dow===0||dow===6 ? 'No classes today. Weekend.' : 'Nothing on the timetable today.'})); return; }
    const ul = el('ul',{className:'cls'});
    items.forEach(c=>{
      const past = sameDay && (now.getHours()*60+now.getMinutes()) >= mins(c.end);
      const nm = el('div',{className:'nm'},[el('span',{className:'k '+c.kind,textContent:c.kind}), document.createTextNode(c.name), el('small',{textContent:c.code+(c.group?' · '+c.group:'')})]);
      ul.append(el('li',{className:(past?'past ':'')+(c.kind==='Meeting'||known(c)?'':'maybe')},[el('span',{className:'tm',textContent:c.start+(c.end&&c.end!==c.start?'–'+c.end:'')}), nm, el('span',{className:'rm',textContent:c.room})]));
    });
    box.append(ul);
  };
  renderToday();
  ['Mon','Tue','Wed','Thu','Fri'].forEach((n,i)=>{
    const col = el('div',{className:'col'+(dow===i+1?' on':'')},[el('span',{className:'dn',textContent:n})]);
    mine.filter(c=>c.day===i+1).sort((a,b)=>mins(a.start)-mins(b.start)).forEach(c=>{
      const b = el('span',{className:'b '+c.kind,textContent:c.start+' '+c.code});
      b.title = c.kind+' · '+c.name+' · '+c.start+'–'+c.end+' · '+c.room+(c.group?' · '+c.group:'');
      col.append(b);
    });
    $('week').append(col);
  });

  // deadlines
  if (D.deadlines && D.deadlines.length){
    // Tick off a deadline once it's submitted. Saved by title (stable across days) in the
    // page's database on the Claude page, and in this browser everywhere.
    const dkey = 'km-deadlines-done'; let ddone = {};
    try { ddone = JSON.parse(localStorage.getItem(dkey)||'{}'); } catch(e){}
    let dlDoc = null; const rows = {};
    const ul = el('ul',{className:'dl'});
    const dpaint = () => {
      D.deadlines.forEach(x=>{ const r=rows[x.title]; const on=!!ddone[x.title]; r.li.classList.toggle('done',on); r.btn.setAttribute('aria-pressed',on); r.btn.setAttribute('aria-label',(on?'Mark not done: ':'Mark done: ')+x.title); });
      const open = D.deadlines.filter(x=>x.level==='today' && !ddone[x.title]).length;
      $('stamp-count').textContent = open ? open+' need attention' : '';
      $('due-progress').textContent = D.deadlines.filter(x=>ddone[x.title]).length+' / '+D.deadlines.length+' done';
    };
    D.deadlines.forEach(x=>{
      const btn = el('button',{type:'button',className:'dtick'});
      const li = el('li',{className:x.level||'later'},[
        btn,
        el('span',{className:'when',textContent:x.when}),
        el('div',{className:'what'},[document.createTextNode(x.title), el('small',{textContent:x.detail||''})])
      ]);
      btn.addEventListener('click',()=>{
        ddone[x.title]=!ddone[x.title]; if(!ddone[x.title]) delete ddone[x.title]; dpaint();
        try{localStorage.setItem(dkey,JSON.stringify(ddone));}catch(e){}
        if (dlDoc) dlDoc.set({done:Object.keys(ddone), updatedAt:new Date().toISOString()}).catch(()=>{});
      });
      rows[x.title]={li,btn}; ul.append(li);
    });
    $('deadlines').append(ul);
    dpaint();
    (async ()=>{
      const d3 = window.claude && window.claude.use ? await window.claude.use('db') : null;
      if (!d3) return;
      dlDoc = d3.collection('checks').doc('deadlines');
      dlDoc.onSnapshot(snap=>{
        const data = snap && snap.data && snap.data();
        if (!data || !Array.isArray(data.done)) return;
        ddone = {}; data.done.forEach(t=>{ ddone[t]=true; }); dpaint();
        try{localStorage.setItem(dkey,JSON.stringify(ddone));}catch(e){}
      }, ()=>{});
    })();
  } else {
    const box = el('div',{className:'empty'});
    box.append(el('b',{textContent:'Loop not linked yet'}), el('span',{textContent:D.deadlinesNote||''}));
    $('deadlines').append(box);
  }

  // essay
  if (D.essay && D.essay.title){
    $('essay').append(
      el('p',{className:'et'},[link(D.essay.title,D.essay.url)]),
      el('div',{className:'em',textContent:[D.essay.year, D.essay.minutes ? D.essay.minutes+' min read' : ''].filter(Boolean).join(' · ')}),
      el('p',{className:'ew',textContent:D.essay.why||''})
    );
  } else { $('essay-sheet').hidden = true; }

  // news
  D.news.slice(0,5).forEach(n=>{
    $('news').append(el('li',{},[el('div',{},[
      el('div',{className:'h'},[link(n.title,n.url)]),
      el('div',{className:'s',textContent:n.summary}),
      n.why ? el('div',{className:'why',textContent:'→ '+n.why}) : ''
    ])]));
  });

  // radar
  if (D.radar && D.radar.length){
    D.radar.forEach(r=> $('radar').append(el('div',{},[el('b',{},[link(r.title,r.url)]), document.createTextNode(r.detail)])));
  } else { $('radar-sheet').hidden = true; }

  // sources
  $('sources').append(el('span',{textContent:'Sources:'}));
  (D.sources||[]).forEach(s=> $('sources').append(link(s.title,s.url)));
  // meetings, stored in the page's database so the morning refresh can plan around them
  const mDate = $('m-date'); mDate.value = new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
  const msg = t => { $('m-msg').textContent = t; };
  const renderMeetings = () => {
    const list = $('mlist'); list.textContent='';
    const up = meetings.filter(m=>m.date>=D.date).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).slice(0,10);
    $('meet-status').textContent = up.length ? up.length+' upcoming' : 'None yet';
    up.forEach(m=>{
      const del = el('button',{type:'button',textContent:'Remove'}); del.setAttribute('aria-label','Remove '+m.title);
      del.addEventListener('click', async ()=>{ del.disabled=true; try{ await db.collection('meetings').doc(m.id).delete(); msg('Removed.'); }catch(e){ del.disabled=false; msg('Could not remove that meeting. Try again.'); } });
      list.append(el('li',{},[el('span',{className:'tm',textContent:(m.date===D.date?'Today':fmtDate(m.date))+' '+m.start}), el('div',{className:'nm'},[document.createTextNode(m.title), el('small',{textContent:[m.end?'until '+m.end:'', m.where||''].filter(Boolean).join(' · ')})]), del]));
    });
    renderToday();
  };
  let db = null;
  $('m-add').disabled = true;
  (async ()=>{
    db = window.claude && window.claude.use ? await window.claude.use('db') : null;
    if (!db){
      // Outside Claude (e.g. the GitHub copy): show the meetings baked in by the morning refresh, read-only.
      $('mform').hidden = true;
      meetings = (D.meetings||[]).map((m,i)=>Object.assign({id:'b'+i},m));
      renderMeetings();
      $('mlist').querySelectorAll('button').forEach(b=>b.remove());
      const a = el('a',{href:'https://claude.ai/artifact/3LBkXyeWk6AL5tTpG8Hs2x',target:'_blank',rel:'noopener',textContent:'Add or remove meetings on your Claude page'});
      $('m-msg').textContent=''; $('m-msg').append(a, document.createTextNode('. They appear here after the next morning refresh.'));
      return;
    }
    $('m-add').disabled = false;
    db.collection('meetings').onSnapshot(snap=>{
      meetings = snap.docs.map(d=>Object.assign({id:d.id}, d.data()||{})).filter(m=>m.title&&m.date&&m.start);
      renderMeetings();
    }, ()=>{ $('meet-status').textContent='Error'; msg('Could not load meetings. Reload the page to retry.'); });
  })();
  $('mform').addEventListener('submit', async ev=>{
    ev.preventDefault(); if(!db) return;
    const m = {title:$('m-title').value.trim(), date:mDate.value, start:$('m-start').value, end:$('m-end').value, where:$('m-where').value.trim(), createdAt:new Date().toISOString()};
    if(!m.title||!m.date||!m.start){ msg('Add a title, date and start time.'); return; }
    $('m-add').disabled = true;
    try { await db.collection('meetings').add(m); msg('Added '+m.title+' on '+fmtDate(m.date)+'.'); $('m-title').value=''; $('m-start').value=''; $('m-end').value=''; $('m-where').value=''; }
    catch(e){ msg('Could not save the meeting. Check you are signed in and try again.'); }
    $('m-add').disabled = false;
  });
})();
</script>

</body></html>
