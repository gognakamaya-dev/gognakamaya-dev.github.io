experience:
  - slug: anaula
    ref: U3
    when: Jun – Aug 2026
    role: Engineering intern
    org: Anaula
    image: anaula-bench.jpg
    alt: A workbench covered in sensors, wiring, a bench power supply and a laptop
    what: |
      My first time in a truly early-stage startup. In a five-person team, I owned most of the electronics and embedded systems for our photobioreactor platform, and built the central control that draws algae on its own.

      There was no existing electronics system to work from, so I had to figure out how the sensors, actuators and control loops fit together, prototype it, test it, and iterate when it didn't work. I integrated temperature, pH, turbidity, dissolved oxygen and optical sensors, drove the LEDs, motors, pumps, valves and heating, and wrote the calibration and test procedures for the sensors.
    specs:
      Platform: STM32, embedded C
      Sensors: temperature, pH, turbidity, dissolved O₂, optical
      Actuators: LEDs, motors, pumps, valves, heating
      Team: five people, I owned the electronics

  - slug: patch
    ref: U4
    when: Jul – Aug 2025
    role: Cohort member
    org: Patch
    image: scopelab-pcb.jpg
    alt: Front of the green ScopeLab analyser circuit board
    what: |
      A two-month summer accelerator for young builders at Dogpatch Labs. I built ScopeLab, a wireless debugging tool for robots. Logic analysers need heavy wiring and keep a robot tethered to the bench; ScopeLab streams I²C and UART traffic over Wi-Fi from an analyser on the robot to an ESP32 dongle on your laptop, so you can debug while the robot is moving.

      I co-designed the custom PCB, was picked for the opening pitch, and demoed it live to 300+ people.
    specs:
      Hardware: co-designed analyser PCB
      Link: ESP32, Wi-Fi streaming
      Buses: I²C, UART, in real time
      Demo: live, to 300+ people

  - slug: akara
    ref: U2
    when: Jun – Aug 2024
    role: Engineering intern
    org: Akara Robotics
    image: akara-violet.jpg
    alt: Violet, Akara's UV sanitation robot, glowing blue in a hospital room
    what: |
      At 16 I worked on the human–robot interaction for Violet, Akara's UV sanitation robot. I designed a custom PCB for its LED system and programmed the lighting patterns with FastLED, so the robot can tell people nearby what it's about to do: turning left, turning right, battery status.

      It ships in the commercial robot, deployed in hospitals in the US, UK and Ireland.
    specs:
      Hardware: custom LED control PCB (KiCad)
      Firmware: FastLED lighting patterns
      Signals: turn left, turn right, battery, status
      Deployed: hospitals in the US, UK and Ireland

  - slug: coderdojo
    ref: U9
    when: Aug 2024 – now
    role: Mentor
    org: CoderDojo Malahide
    what: |
      I teach young learners to code in Scratch and Python, write the lesson plans, help them build their first projects, and run robotics competitions for 20+ students.
    specs:
      Teaching: Scratch, Python
      Students: 20+

projects:
  - slug: fiacla
    ref: U5
    name: "Fiacla: AI for panoramic X-rays"
    image: fiacla-xray.jpg
    alt: A panoramic dental X-ray with a region highlighted
    what: |
      Flowchart-based diagnosis of panoramic X-rays misses up to 49% of cases. I built a clinically validated dataset with dentists at the Dublin Dental University Hospital, trained a CNN with active contour layers to detect radiolucencies, and built a web app where dentists upload an X-ray and get AI-assisted analysis in real time.
    specs:
      Misdiagnosis: 49% → 13%
      F1 score: 87%
      Trial: dentists at DDUH

  - slug: intraoral
    ref: U6
    name: A photogrammetry intraoral scanner
    image: intraoral-scan.jpg
    alt: A 3D-printed dental model on a calibration checkerboard
    what: |
      A dental scanner built from scratch, on my own: the housing for the optics and camera, the electronics, and software that uses photogrammetry to reconstruct 3D models of teeth in real time. Clear digital impressions without the cost of a commercial scanner.
    specs:
      Method: photogrammetry
      Built: optics housing, PCB, software
      Team: just me

  - slug: robowars
    ref: M1
    name: Robowars
    image: robowars-build.jpg
    alt: Building the red combat robot with a chainsaw weapon
    what: |
      A remote-controlled combat robot built for Patch Robowars at Dogpatch Labs, right in the middle of my exams. Mecanum wheels on BLDC motors, a hot-swappable high-current battery pack, a chainsaw for a weapon, and an outer shell made of baking tins.
    specs:
      Drive: BLDC motors, mecanum wheels
      Weapon: chainsaw, remote actuated
      Armour: baking tins

  - slug: iss
    ref: U7
    name: A camera on the ISS
    image: iss-earth.jpg
    alt: A circular view of Earth taken from orbit
    what: |
      At 14 I was selected to send my own Raspberry Pi camera to the International Space Station. It captured about three hours of Earth observation footage, which I labelled against a global biome map and used to train a model that classifies biomes from orbit. I then extended it to compare Earth's biomes with possible analogues on other planets.
    specs:
      Footage: ~3 hours from orbit
      Model: terrestrial biome classifier
      Programme: ESA Mission Space Lab

  - slug: accellab
    ref: U8
    name: AccelLab
    link: https://github.com/gognakamaya-dev/AccelLab
    what: |
      A 3D particle accelerator visualiser with torus geometry and simulated trajectories, in NumPy and Matplotlib.
    specs:
      Stack: Python, NumPy, Matplotlib

  - slug: solar
    ref: U10
    name: Solar storm prediction
    what: |
      At the BTYSTE Bootcamp, one of 30 projects picked from 550+, I was CTO of a team that built a model to forecast solar storms from Parker spiral diagrams.
    specs:
      Role: CTO

